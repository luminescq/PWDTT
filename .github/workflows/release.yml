name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          name: pwdtt-linux-amd64
          path: dist

      - name: Download Windows artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          name: pwdtt-windows-amd64
          path: dist

      - name: Download macOS artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          name: pwdtt-macos
          path: dist

      - name: List dist contents
        run: find dist/ -maxdepth 3 -ls

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/pwdtt-linux-amd64
            dist/pwdtt-windows-amd64.exe
            dist/PWDTT-macos.zip
          body: |
            ## PWDTT v1.6.0

            **Транспорт и ядро:**
            - TURN TCP транспорт (переключатель UDP/TCP в настройках)
            - Автообновление TURN-кредов при 401: туннель больше не умирает через ~10 минут
            - Фейл GetCreds больше не блокирует запуск следующих групп воркеров
            - Пер-воркерский режим обфускации вместо общей записи (data race устранён)
            - Устранена утечка горутин релея на error-путях сессии
            - Восстановление логгера при неудачном старте ядра

            **Bridge и WG:**
            - Generation guard: быстрый Disconnect→Connect больше не ломает новую сессию
            - stateMu: устранена гонка Apply/Teardown на состоянии WireGuard (Windows/macOS)
            - Закрытие лог-файла при неудачном подключении
            - Статический GUID wintun вынесен в windows-only wg_windows_init.go

            **UI и профили:**
            - Кириллица и Unicode в именах серверов
            - Хеши сохраняются в бэкенд-профиль; ошибки сохранения не расходуют UI с диском
            - Toast-уведомление при ошибке импорта wdtt://-ссылки

            **Тесты:**
            - Изоляция store-тестов на Windows/Linux (AppData/XDG_CONFIG_HOME) — тесты больше не пишут в реальный конфиг
            - Остановка ядра в bridge-тестах, актуализированные ожидания настроек

            **От сообщества (by @Regstar2):**
            - Авторизация не-конфиговых DTLS-воркеров: фикс «Reader: EOF» на новых qWDTT-серверах (fix #27)
            - Скролл длинного списка серверов + обрезка длинных имён

            **Platforms:**
            - Linux x86_64
            - Windows x86_64
            - macOS (Universal: Intel + Apple Silicon)
