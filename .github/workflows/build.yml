name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev pkg-config gcc libgtk-3-dev webkit2gtk-4.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Linux
        run: wails build -platform linux/amd64 -o pwdtt-linux-amd64

      - name: Build Windows
        run: wails build -platform windows/amd64 -o pwdtt-windows-amd64.exe

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwdtt-linux-amd64
          path: build/bin/pwdtt-linux-amd64

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwdtt-windows-amd64
          path: build/bin/pwdtt-windows-amd64.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: pwdtt-linux-amd64
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: pwdtt-windows-amd64
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pwdtt-linux-amd64
            dist/pwdtt-windows-amd64.exe
          body: |
            ## v1.2 - Linux - Windows

            **Fix:**
            - wdtt:// парсер (# в пароле больше не ломает)
            - Баг стейла серверов (selectedRef)
            - Margin пароля в модалках
            - Деплой: SCP → dd (fix deadlock 12MB)

            **Add:**
            - Глазик пароля (toggle видимости)
            - Авто-подключение при запуске
            - Размер файла в логах деплоя
            - Linux иконка (window + taskbar)
            - GitHub Actions CI/CD

            **Next:**
            - macOS версия
